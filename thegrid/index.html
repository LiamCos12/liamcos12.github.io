<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>The Grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 500px;
      padding: 30px;
    }

    img.logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 17px;
      margin-bottom: 25px;
      color: #555;
      line-height: 1.5;
    }

    a.button {
      display: inline-block;
      background: #007AFF;
      color: white;
      padding: 15px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    a.button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LOGO -->
    <img class="logo" src="logo.png" alt="The Grid Logo">

    <h1>The Grid</h1>

    <p>
      A minimalist daily Sudoku built for focus and clarity.  
      Solve one carefully crafted puzzle each day — simple, relaxing, and rewarding.
    </p>

    <p>
      No clutter. No distractions. Just pure Sudoku, every day.
    </p>

    <a class="button" href="https://apps.apple.com/us/app/the-grid-daily-sudoku/id6758593356">
      Download on the App Store
    </a>

  </div>
</body>
</html>
</html>
